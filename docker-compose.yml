services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
      # Todos los ajustes están comentados en `.env.example`, con qué significa
      # tocar cada uno. Aquí sólo se les da un valor por defecto prudente.
      - MAX_CONTENT_LENGTH_MB=${MAX_CONTENT_LENGTH_MB:-50}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
      - MAX_CONCURRENT_CONVERSIONS=${MAX_CONCURRENT_CONVERSIONS:-1}
      - OCR_TIMEOUT_SECONDS=${OCR_TIMEOUT_SECONDS:-240}
      - PDF_TO_WORD_TIMEOUT_SECONDS=${PDF_TO_WORD_TIMEOUT_SECONDS:-240}
      - DOC_TO_PDF_TIMEOUT_SECONDS=${DOC_TO_PDF_TIMEOUT_SECONDS:-180}
    # Un tope, no una reserva: si algo se desmadra muere este contenedor y lo
    # reinicia Docker, en vez de que el kernel se ponga a matar procesos por toda
    # la máquina y se lleve por delante a lo que haya al lado.
    #
    # 1,5 GB da margen de sobra: medido, el worker en reposo ronda los 300 MB y
    # el trabajo más pesado añade unos 145 MB. Lo que puede sumar de verdad son
    # varios workers y varias conversiones a la vez, y eso lo decides con
    # `GUNICORN_WORKERS` y `MAX_CONCURRENT_CONVERSIONS`.
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    cpus: 4.0
    networks:
      - app-network

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    mem_limit: 256m
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
