server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Toda la API va bajo /api/, así que añadir herramientas nuevas no obliga a
    # tocar este archivo.
    # `^~` para que ninguna regla con expresión regular pueda capturar la API.
    location ^~ /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Archivos grandes: sin límite de buffer ni cortes por tiempo de proceso.
        client_max_body_size 200M;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # nginx no lleva la extensión .mjs en su tabla de tipos y la serviría como
    # binario; el navegador rechaza cualquier módulo que no llegue declarado
    # como JavaScript. Lo necesita el worker de pdf.js, que usa "firmar".
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # Los recursos con hash en el nombre no cambian nunca.
    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El resto lo resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
