<header class="text-center mb-5">
  <h1 class="fw-semibold">Herramientas para PDF e imágenes</h1>
  <p class="text-body-secondary mb-0">
    Rápidas, sin registro y sin marcas de agua. Elige una para empezar.
  </p>
</header>

<section *ngFor="let grupo of grupos" class="mb-5">
  <h2 class="h6 text-uppercase text-body-secondary mb-3">{{ grupo.categoria }}</h2>

  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg-4" *ngFor="let herramienta of grupo.herramientas">
      <!-- Disponible: tarjeta enlazada -->
      <a *ngIf="herramienta.disponible"
         class="tarjeta card h-100 text-decoration-none"
         [routerLink]="rutaDe(herramienta)">
        <div class="card-body">
          <i class="bi {{ herramienta.icono }} fs-3 text-primary"></i>
          <h3 class="h6 mt-2 mb-1">{{ herramienta.nombre }}</h3>
          <p class="small text-body-secondary mb-0">{{ herramienta.descripcion }}</p>
        </div>
      </a>

      <!-- Aún no disponible: misma tarjeta, atenuada y sin enlace -->
      <div *ngIf="!herramienta.disponible" class="tarjeta card h-100 tarjeta--pendiente">
        <div class="card-body">
          <i class="bi {{ herramienta.icono }} fs-3 text-body-secondary"></i>
          <h3 class="h6 mt-2 mb-1">
            {{ herramienta.nombre }}
            <span class="badge text-bg-light fw-normal align-middle ms-1">Próximamente</span>
          </h3>
          <p class="small text-body-secondary mb-0">{{ herramienta.descripcion }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
