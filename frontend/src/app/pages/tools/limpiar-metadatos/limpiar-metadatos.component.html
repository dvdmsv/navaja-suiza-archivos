<app-tool-page slug="limpiar-metadatos">

  <app-file-queue
    [items]="archivos"
    accept=".pdf,image/*"
    [deshabilitado]="ocupado"
    ayuda="Arrastra aquí tus PDF o tus fotos"
    (agregados)="alAgregar($event)"
    (itemsChange)="alCambiarLista()">
  </app-file-queue>

  <div class="form-check mt-4">
    <input class="form-check-input" type="checkbox" id="a-fondo"
           [disabled]="ocupado" [(ngModel)]="aFondo" (change)="alCambiarLista()">
    <label class="form-check-label" for="a-fondo">
      Limpieza a fondo de los PDF
      <span class="d-block form-text mt-0">
        Además de los metadatos quita el JavaScript incrustado, los archivos
        adjuntos, el texto oculto y las miniaturas. Los enlaces y el índice se
        respetan.
      </span>
    </label>
  </div>

  <app-tool-controls [pagina]="pagina" accion="Limpiar los metadatos" icono="bi-incognito">
  </app-tool-controls>

  <section class="card mt-4" *ngIf="metadatos as informe">
    <div class="card-header d-flex flex-wrap align-items-center gap-2">
      <strong class="me-auto">Esto llevaban dentro tus archivos</strong>
      <span class="badge text-bg-danger" *ngIf="algunaUbicacion">
        <i class="bi bi-geo-alt-fill me-1"></i>con tu ubicación
      </span>
    </div>

    <p class="small text-body-secondary px-3 pt-3 mb-0" *ngIf="sinRastro">
      No llevaban nada: ni autor, ni programa, ni fecha. Aun así se han vuelto a
      guardar limpios.
    </p>

    <ul class="list-group list-group-flush">
      <li class="list-group-item" *ngFor="let archivo of informe">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-file-earmark text-body-secondary"></i>
          <span class="text-truncate fw-semibold">{{ archivo.archivo }}</span>
        </div>

        <p class="small text-body-secondary mb-0 mt-1" *ngIf="archivo.campos.length === 0">
          Sin metadatos.
        </p>

        <dl class="row small mb-0 mt-2" *ngIf="archivo.campos.length > 0">
          <ng-container *ngFor="let campo of archivo.campos">
            <dt class="col-5 col-sm-4 text-body-secondary fw-normal">{{ campo.etiqueta }}</dt>
            <dd class="col-7 col-sm-8 mb-1 text-break">{{ campo.valor }}</dd>
          </ng-container>
        </dl>

        <p class="small text-danger mb-0 mt-1" *ngIf="archivo.ubicacion">
          <i class="bi bi-exclamation-triangle-fill me-1"></i>
          Esta foto llevaba dentro dónde se hizo. Ya no.
        </p>
      </li>
    </ul>
  </section>

  <app-result-list [archivos]="resultados" [resumen]="resumen" nombreZip="sin-metadatos.zip">
  </app-result-list>

</app-tool-page>
