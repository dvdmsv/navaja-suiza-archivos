<div class="visor" [class.visor--oscuro]="oscuro">

  <!-- Barra de herramientas -->
  <header class="barra">
    <a class="barra__marca" routerLink="/" title="Volver a las herramientas">
      <i class="bi bi-arrow-left"></i>
    </a>

    <button type="button" class="boton" [class.boton--activo]="panelAbierto"
            [disabled]="!documento" (click)="alternarPanel()" title="Panel lateral">
      <i class="bi bi-layout-sidebar"></i>
    </button>

    <ng-container *ngIf="documento">
      <span class="contador">
        <input type="number" class="contador__campo" min="1" [max]="medidas.length"
               [ngModel]="paginaActual" (ngModelChange)="irAPagina(+$event)">
        <span class="text-body-secondary">/ {{ medidas.length }}</span>
      </span>

      <span class="separador"></span>

      <button type="button" class="boton" (click)="aplicarZoom(0.8)" title="Alejar">
        <i class="bi bi-zoom-out"></i>
      </button>
      <span class="zoom">{{ (escala * 100).toFixed(0) }} %</span>
      <button type="button" class="boton" (click)="aplicarZoom(1.25)" title="Acercar">
        <i class="bi bi-zoom-in"></i>
      </button>
      <button type="button" class="boton" [class.boton--activo]="modoZoom === 'ancho'"
              (click)="ajustar('ancho')" title="Ajustar al ancho">
        <i class="bi bi-arrows"></i>
      </button>
      <button type="button" class="boton" [class.boton--activo]="modoZoom === 'pagina'"
              (click)="ajustar('pagina')" title="Ajustar la página entera">
        <i class="bi bi-aspect-ratio"></i>
      </button>
      <button type="button" class="boton" [class.boton--activo]="columnas === 2"
              (click)="alternarColumnas()" title="Dos páginas">
        <i class="bi bi-book"></i>
      </button>
      <button type="button" class="boton" [class.boton--activo]="oscuro"
              (click)="alternarOscuro()" title="Modo oscuro">
        <i class="bi bi-moon-stars"></i>
      </button>

      <span class="separador"></span>

      <!-- Herramientas de marcado -->
      <button type="button" class="boton" [class.boton--activo]="herramienta === 'leer'"
              (click)="herramienta = 'leer'" title="Leer">
        <i class="bi bi-hand-index"></i>
      </button>
      <button type="button" class="boton" [class.boton--activo]="herramienta === 'subrayar'"
              (click)="herramienta = 'subrayar'" title="Subrayar el texto que selecciones">
        <i class="bi bi-highlighter"></i>
      </button>
      <span class="colores" *ngIf="herramienta === 'subrayar'">
        <button type="button" class="color color--amarillo" [class.color--elegido]="colorSubrayado === 'amarillo'"
                (click)="colorSubrayado = 'amarillo'" title="Amarillo"></button>
        <button type="button" class="color color--verde" [class.color--elegido]="colorSubrayado === 'verde'"
                (click)="colorSubrayado = 'verde'" title="Verde"></button>
        <button type="button" class="color color--azul" [class.color--elegido]="colorSubrayado === 'azul'"
                (click)="colorSubrayado = 'azul'" title="Azul"></button>
        <button type="button" class="color color--rosa" [class.color--elegido]="colorSubrayado === 'rosa'"
                (click)="colorSubrayado = 'rosa'" title="Rosa"></button>
      </span>

      <button type="button" class="boton" [class.boton--activo]="herramienta === 'tachar'"
              (click)="herramienta = 'tachar'" title="Eliminar del PDF el texto que selecciones">
        <i class="bi bi-eraser"></i>
      </button>
      <span class="colores" *ngIf="herramienta === 'tachar'">
        <button type="button" class="color color--negro" [class.color--elegido]="colorTachado === 'negro'"
                (click)="colorTachado = 'negro'" title="Tapar en negro"></button>
        <button type="button" class="color color--blanco" [class.color--elegido]="colorTachado === 'blanco'"
                (click)="colorTachado = 'blanco'" title="Dejarlo en blanco"></button>
      </span>

      <button type="button" class="boton" [class.boton--activo]="menuAlSeleccionar"
              (click)="alternarMenuAlSeleccionar()"
              title="Preguntar qué hacer al seleccionar texto">
        <i class="bi bi-menu-button-wide"></i>
      </button>

      <button type="button" class="boton" [disabled]="!cambios.sePuedeDeshacer"
              (click)="deshacer()" title="Deshacer (Ctrl+Z)">
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>

      <span class="barra__hueco"></span>

      <button type="button" class="btn btn-sm btn-outline-success" *ngIf="resultado"
              (click)="descargar()">
        <i class="bi bi-download me-1"></i>Descargar
      </button>
      <button type="button" class="btn btn-sm btn-primary" [disabled]="!hayCambios || guardando"
              (click)="guardar()">
        <span class="spinner-border spinner-border-sm me-1" *ngIf="guardando"></span>
        Guardar
      </button>
    </ng-container>
  </header>

  <!-- Cuerpo -->
  <div class="cuerpo">
    <app-visor-panel *ngIf="documento && panelAbierto"
      [documento]="documento" [totalPaginas]="medidas.length" [paginaActual]="paginaActual"
      [pestana]="pestana" [indice]="indice" [marcas]="cambios.marcas"
      [eliminadas]="cambios.eliminadas" [rotaciones]="cambios.rotaciones"
      [resultados]="resultados" [consulta]="consulta" [buscando]="indexando"
      [indexadas]="indexadas" [resultadoActual]="resultadoActual"
      (pestanaChange)="pestana = $event" (consultaChange)="buscar($event)"
      (irAPagina)="irAPaginaDesdePanel($event)" (irAResultado)="irAResultado($event)"
      (girar)="girarPagina($event)" (eliminar)="eliminarPagina($event)"
      (restaurar)="restaurarPagina($event)" (quitarMarca)="quitarMarca($event)">
    </app-visor-panel>

    <div class="lectura" #lectura [class.lectura--marcando]="herramienta !== 'leer'">
      <!-- Sin documento: sitio donde soltarlo -->
      <div class="bienvenida" *ngIf="!documento && !cargando"
           [class.bienvenida--soltando]="arrastrando"
           (dragover)="$event.preventDefault(); arrastrando = true"
           (dragleave)="arrastrando = false" (drop)="alSoltarArchivo($event)">
        <i class="bi bi-file-earmark-pdf"></i>
        <h1 class="h4 mt-3">Visor de PDF</h1>
        <p class="text-body-secondary">
          Arrastra aquí un PDF para leerlo, buscar dentro, subrayarlo o quitarle páginas.
        </p>
        <label class="btn btn-primary">
          Elegir un PDF
          <input type="file" accept=".pdf" hidden (change)="alElegirArchivo($event)">
        </label>
        <p class="pista">
          Todo ocurre en tu navegador: el documento sólo sube al servidor si guardas cambios.
        </p>
      </div>

      <p class="cargando" *ngIf="cargando">
        <span class="spinner-border spinner-border-sm me-2"></span>Abriendo el documento…
      </p>

      <!-- Lienzo de lectura: alto real, pero sólo con lo que se ve montado -->
      <div class="lienzo" *ngIf="documento" [style.height.px]="disposicion.altoTotal">
        <app-visor-pagina *ngFor="let visible of visibles; trackBy: porNumero"
          class="pagina-suelta"
          [style.top.px]="visible.top" [style.left.px]="visible.colocada.izquierda"
          [documento]="documento" [colocada]="visible.colocada" [escala]="escala"
          [marcando]="herramienta !== 'leer'" [menuAlSeleccionar]="menuAlSeleccionar"
          [marcas]="marcasDe(visible.colocada.numero)"
          [coincidencias]="coincidenciasDe(visible.colocada.numero)"
          (seleccionado)="alSeleccionar($event)" (marcaPulsada)="quitarMarca($event)"
          (colorCambiado)="cambiarColorMarca($event)" (accionSeleccion)="alPedirAccion($event)">
        </app-visor-pagina>
      </div>
    </div>
  </div>
</div>
