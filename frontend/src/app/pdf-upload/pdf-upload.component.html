<div class="container">
    <h2>Subir PDF</h2>
    <div class="mb-3">
        <input #fileInput class="form-control" type="file" id="formFile" (change)="onFileSelected($event)" accept=".pdf" multiple>
    </div>

    <div>
        <!-- Usamos la propiedad simple 'pendingCount' y 'hasPendingFiles' -->
        <button (click)="onUpload()" type="button" class="btn btn-primary" [disabled]="!hasPendingFiles">
            Subir <span *ngIf="hasPendingFiles">({{ pendingCount }})</span>
        </button>
        <button (click)="onClear()" type="button" class="btn btn-danger">Limpiar Todo</button>
    </div>

    <h2>Combinar PDFs (Orden de Fusión)</h2>
    <!-- Indicamos el requisito para la combinación -->
    <p class="text-muted" *ngIf="uploadedFiles.length > 0 && hasPendingFiles">
        <i class="bi bi-exclamation-triangle-fill text-warning"></i>
        Aún quedan **{{ pendingCount }}** archivos por subir al servidor.
    </p>
    <p class="text-muted" *ngIf="uploadedFiles.length > 0 && !hasPendingFiles">
        Arrastra los archivos para cambiar el orden.
    </p>

    <ul class="list-group w-100" style="max-width: 600px;" cdkDropList (cdkDropListDropped)="drop($event)">
        <li class="list-group-item d-flex justify-content-between align-items-center" 
            *ngFor="let fileItem of uploadedFiles" 
            cdkDrag>
            
            <span>
                <!-- Icono de arrastre solo si está subido -->
                <i *ngIf="fileItem.isUploaded" class="bi bi-grip-vertical text-muted me-2" style="cursor: grab;"></i> 
                <!-- Nombre del archivo real -->
                {{fileItem.file.name}}
            </span>
            
            <!-- Indicador de estado usando ngSwitch correctamente importado -->
            <div [ngSwitch]="true">
                <!-- Subiendo (Barra de progreso del Swal ya lo indica, pero ponemos texto) -->
                <span *ngSwitchCase="fileItem.uploading" class="badge bg-info text-white">Subiendo...</span>

                <!-- Subido -->
                <span *ngSwitchCase="fileItem.isUploaded" class="badge bg-success">
                    <i class="bi bi-check-circle-fill"></i> Subido
                </span>

                <!-- Local/Pendiente -->
                <span *ngSwitchCase="!fileItem.isUploaded" class="badge bg-warning text-dark">
                    <i class="bi bi-upload"></i> Local
                </span>
            </div>
            
            <div *cdkDragPlaceholder class="custom-placeholder"></div>
        </li>
    </ul>

    <!-- El botón de combinar solo se activa si la lista no está vacía Y no hay archivos pendientes -->
    <button *ngIf="uploadedFiles.length > 0" 
            (click)="onMerge()" 
            type="button" 
            class="btn btn-secondary mt-3"
            [disabled]="hasPendingFiles">
        Combinar PDFs
    </button>

    <div *ngIf="mergeResult" class="mt-3">
        <button class="btn btn-success" (click)="onDownload()">Descargar archivo combinado</button>
    </div>
</div>
