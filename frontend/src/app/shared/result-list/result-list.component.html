<section class="card border-success mt-4" *ngIf="archivos.length > 0">
  <div class="card-header bg-success-subtle border-success d-flex flex-wrap align-items-center gap-2">
    <i class="bi bi-check-circle-fill text-success"></i>
    <strong class="me-auto">
      {{ archivos.length === 1 ? 'Tu archivo está listo' : 'Tus ' + archivos.length + ' archivos están listos' }}
    </strong>

    <span class="badge text-bg-success" *ngIf="ahorro as porcentaje">
      {{ porcentaje }} % menos de peso
    </span>
  </div>

  <p class="small text-body-secondary px-3 pt-3 mb-0" *ngIf="resumen">
    De {{ resumen.antes | peso }} a {{ resumen.despues | peso }}.
  </p>

  <ul class="list-group list-group-flush">
    <li class="list-group-item d-flex align-items-center gap-2" *ngFor="let archivo of archivos">
      <i class="bi bi-file-earmark-check text-success flex-shrink-0"></i>

      <ng-container *ngIf="editando !== archivo.id">
        <span class="text-truncate flex-grow-1" [title]="archivo.name">{{ archivo.name }}</span>
        <span class="small text-body-secondary flex-shrink-0">{{ archivo.size | peso }}</span>
        <button type="button" class="btn btn-sm btn-link text-body-secondary p-0 flex-shrink-0"
                (click)="editar(archivo)" [attr.aria-label]="'Cambiar el nombre de ' + archivo.name">
          <i class="bi bi-pencil"></i>
        </button>
      </ng-container>

      <ng-container *ngIf="editando === archivo.id">
        <div class="input-group input-group-sm flex-grow-1">
          <input #entradaNombre type="text" class="form-control" [(ngModel)]="borrador"
                 [disabled]="guardando" aria-label="Nombre del archivo"
                 (keydown.enter)="confirmar(archivo)" (keydown.escape)="cancelar()">
          <span class="input-group-text">{{ extensionDe(archivo) }}</span>
        </div>
        <button type="button" class="btn btn-sm btn-success flex-shrink-0" [disabled]="guardando"
                (click)="confirmar(archivo)" aria-label="Guardar el nombre">
          <i class="bi bi-check-lg"></i>
        </button>
        <button type="button" class="btn btn-sm btn-outline-secondary flex-shrink-0"
                [disabled]="guardando" (click)="cancelar()" aria-label="Dejarlo como estaba">
          <i class="bi bi-x-lg"></i>
        </button>
      </ng-container>

      <button type="button" class="btn btn-sm btn-outline-secondary flex-shrink-0"
              *ngIf="editando !== archivo.id && sePuedeVer(archivo)" (click)="ver(archivo, $event)">
        <i class="bi bi-eye"></i><span class="visually-hidden">Ver {{ archivo.name }}</span>
      </button>

      <button type="button" class="btn btn-sm btn-outline-success flex-shrink-0"
              *ngIf="editando !== archivo.id" (click)="descargar(archivo)">
        <i class="bi bi-download"></i><span class="visually-hidden">Descargar {{ archivo.name }}</span>
      </button>
    </li>
  </ul>

  <div class="card-body d-flex flex-wrap align-items-center gap-2" *ngIf="archivos.length > 1">
    <div class="input-group input-group-sm nombre-zip">
      <input type="text" class="form-control" [(ngModel)]="nombreDelZip" [disabled]="empaquetando"
             aria-label="Nombre del ZIP">
      <span class="input-group-text">.zip</span>
    </div>

    <button type="button" class="btn btn-success" [disabled]="empaquetando" (click)="descargarTodo()">
      <span class="spinner-border spinner-border-sm me-1" *ngIf="empaquetando" aria-hidden="true"></span>
      <i class="bi bi-file-earmark-zip me-1" *ngIf="!empaquetando"></i>
      Descargar todo en un ZIP
    </button>
  </div>

  <app-vista-previa [archivo]="viendo" (cerrado)="cerrarVista()"></app-vista-previa>
</section>
