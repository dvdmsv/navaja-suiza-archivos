@if (imagen || cargando) {
  <section class="mt-4">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
      <h2 class="h6 mb-0 me-auto">Así va a quedar</h2>
      @if (cargando) {
        <span class="small text-body-secondary">
          <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
          Actualizando…
        </span>
      }
      @if (paginas > 1) {
        <div>
          <label for="pagina-vista" class="visually-hidden">Página</label>
          <select class="form-select form-select-sm" id="pagina-vista" [disabled]="deshabilitado"
            [ngModel]="pagina" (ngModelChange)="paginaChange.emit($event)">
            @for (numero of numeros; track numero) {
              <option [ngValue]="numero">
                Página {{ numero }} de {{ paginas }}
              </option>
            }
          </select>
        </div>
      }
    </div>
    @if (imagen) {
      <div class="lienzo" [class.lienzo--viejo]="cargando">
        <img class="pagina" [src]="imagen" alt="Vista previa de la página">
      </div>
    }
  </section>
}
